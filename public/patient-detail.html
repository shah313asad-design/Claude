<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details - Clinic CRM</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🏥 Clinic CRM</h1>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/patients.html">Patient List</a>
                <a href="/register.html">New Patient</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="patientContent">
            <p class="loading">Loading...</p>
        </div>
    </div>

    <script>
        let currentPatientId = null;

        async function loadPatientDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            currentPatientId = urlParams.get('id');

            if (!currentPatientId) {
                document.getElementById('patientContent').innerHTML = '<p class="error">Patient not found</p>';
                return;
            }

            try {
                const response = await fetch(`/api/patients/${currentPatientId}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                displayPatientDetails(data);
            } catch (error) {
                console.error('Error loading patient:', error);
                document.getElementById('patientContent').innerHTML = '<p class="error">Error loading patient</p>';
            }
        }

        function displayPatientDetails(data) {
            const { patient, familyMembers, pastIllnesses, visits } = data;

            const content = `
                <div class="page-header">
                    <h2>${patient.name}</h2>
                    <a href="/visit.html?patientId=${patient.id}" class="btn btn-primary">+ Add New Visit</a>
                </div>

                <div class="patient-detail-grid">
                    <!-- Left Column: Patient Info & Family -->
                    <div class="left-column">
                        <!-- Patient Info Card -->
                        <div class="card">
                            <h3>Patient Information</h3>
                            <div class="info-grid">
                                <div class="info-item">
                                    <label>Name:</label>
                                    <span>${patient.name}</span>
                                </div>
                                <div class="info-item">
                                    <label>Age:</label>
                                    <span>${patient.age} years</span>
                                </div>
                                <div class="info-item">
                                    <label>Gender:</label>
                                    <span>${patient.gender}</span>
                                </div>
                                <div class="info-item">
                                    <label>Father/Husband:</label>
                                    <span>${patient.father_or_husband_name || '-'}</span>
                                </div>
                                <div class="info-item">
                                    <label>Village/Street:</label>
                                    <span>${patient.village_or_street}</span>
                                </div>
                                <div class="info-item">
                                    <label>WhatsApp:</label>
                                    <span>${patient.whatsapp_number}</span>
                                </div>
                                <div class="info-item">
                                    <label>Family Relation:</label>
                                    <span>${getRelationInEnglish(patient.relation_with_hof)}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Family Members Card -->
                        ${familyMembers && familyMembers.length > 1 ? `
                        <div class="card">
                            <h3>Family Members</h3>
                            <div class="family-list">
                                ${familyMembers.map(member => `
                                    <div class="family-member ${member.id == currentPatientId ? 'current' : ''}"
                                         onclick="${member.id != currentPatientId ? `window.location.href='/patient-detail.html?id=${member.id}'` : ''}">
                                        <div class="member-info">
                                            <strong>${member.name}</strong>
                                            ${member.is_head_of_family ? '<span class="badge badge-success">Head</span>' : ''}
                                        </div>
                                        <div class="member-meta">
                                            <span>${member.age} years, ${member.gender}</span>
                                            <span>${getRelationInEnglish(member.relation_with_hof)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <!-- Past Illnesses Card -->
                        <div class="card">
                            <h3>Past Illnesses</h3>
                            ${pastIllnesses && pastIllnesses.length > 0 ? `
                                <ul class="illness-list">
                                    ${pastIllnesses.map(illness => `
                                        <li>
                                            <strong>${illness.illness_name}</strong>
                                            <small>First occurrence: ${formatDate(illness.first_occurrence_date)}</small>
                                        </li>
                                    `).join('')}
                                </ul>
                            ` : '<p class="empty-state">No past illnesses recorded</p>'}
                        </div>
                    </div>

                    <!-- Right Column: Visits -->
                    <div class="right-column">
                        <div class="card">
                            <h3>Visit History</h3>
                            ${visits && visits.length > 0 ? `
                                <div class="visits-list">
                                    ${visits.map(visit => `
                                        <div class="visit-card">
                                            <div class="visit-header">
                                                <strong>📅 ${formatDate(visit.visit_date)}</strong>
                                                <button onclick="printVisit(${visit.id})" class="btn-icon" title="Print">🖨️</button>
                                            </div>
                                            <div class="visit-content">
                                                <div class="visit-section">
                                                    <label>Chief Complaint:</label>
                                                    <p>${visit.chief_complaint || '-'}</p>
                                                </div>
                                                ${visit.past_history ? `
                                                <div class="visit-section">
                                                    <label>Past History:</label>
                                                    <p>${visit.past_history}</p>
                                                </div>
                                                ` : ''}
                                                <div class="visit-section">
                                                    <label>Prescription:</label>
                                                    <p class="prescription">${visit.prescription || '-'}</p>
                                                </div>
                                                ${visit.investigations ? `
                                                <div class="visit-section">
                                                    <label>Investigations:</label>
                                                    <p>${visit.investigations}</p>
                                                </div>
                                                ` : ''}
                                                <div class="visit-footer">
                                                    <span class="fee">Fee: ₹${visit.fee_paid}</span>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p class="empty-state">No visits recorded</p>'}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('patientContent').innerHTML = content;
        }

        function getRelationInEnglish(relation) {
            const relations = {
                'self': 'Head',
                'wife': 'Wife',
                'husband': 'Husband',
                'son': 'Son',
                'daughter': 'Daughter',
                'mother': 'Mother',
                'father': 'Father',
                'other': 'Other'
            };
            return relations[relation] || relation;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function printVisit(visitId) {
            try {
                const response = await fetch(`/api/visits/${visitId}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                const { visit, patient } = data;

                // Create print window
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <title>Prescription - ${patient.name}</title>
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; }
                            .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
                            .patient-info { margin-bottom: 20px; }
                            .patient-info div { margin: 5px 0; }
                            .section { margin: 15px 0; }
                            .section label { font-weight: bold; display: block; margin-bottom: 5px; }
                            .prescription { white-space: pre-line; line-height: 1.8; }
                            .footer { margin-top: 40px; text-align: right; }
                            @media print { .no-print { display: none; } }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h2>🏥 Rural Clinic</h2>
                            <p>Prescription</p>
                        </div>
                        <div class="patient-info">
                            <div><strong>Name:</strong> ${patient.name}</div>
                            <div><strong>Age/Gender:</strong> ${patient.age} years / ${patient.gender}</div>
                            <div><strong>Village:</strong> ${patient.village_or_street}</div>
                            <div><strong>Date:</strong> ${formatDate(visit.visit_date)}</div>
                        </div>
                        <div class="section">
                            <label>Chief Complaint:</label>
                            <p>${visit.chief_complaint}</p>
                        </div>
                        ${visit.past_history ? `
                        <div class="section">
                            <label>Past History:</label>
                            <p>${visit.past_history}</p>
                        </div>
                        ` : ''}
                        <div class="section">
                            <label>Prescription:</label>
                            <p class="prescription">${visit.prescription}</p>
                        </div>
                        ${visit.investigations ? `
                        <div class="section">
                            <label>Investigations:</label>
                            <p>${visit.investigations}</p>
                        </div>
                        ` : ''}
                        <div class="footer">
                            <p>Doctor's Signature: _________________</p>
                        </div>
                        <div class="no-print" style="text-align: center; margin-top: 20px;">
                            <button onclick="window.print()">Print</button>
                            <button onclick="window.close()">Close</button>
                        </div>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            } catch (error) {
                console.error('Error loading visit:', error);
                alert('Error loading visit');
            }
        }

        // Load patient details on page load
        loadPatientDetails();
    </script>
</body>
</html>
