<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Patient - Clinic CRM</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🏥 Clinic CRM</h1>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/patients.html">Patient List</a>
                <a href="/register.html" class="active">New Patient</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Register New Patient</h2>
        </div>

        <div class="card">
            <form id="patientForm" onsubmit="registerPatient(event)">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" class="form-input" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age" class="form-input" min="0" max="150" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" class="form-input" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fatherHusbandName">Father/Husband Name</label>
                    <input type="text" id="fatherHusbandName" name="father_or_husband_name" class="form-input">
                </div>

                <div class="form-group">
                    <label for="whatsappNumber">WhatsApp Number *</label>
                    <input type="tel" id="whatsappNumber" name="whatsapp_number" class="form-input"
                           pattern="[0-9]{10}" maxlength="10" placeholder="10 digit number" required>
                    <small>Enter 10 digit mobile number</small>
                </div>

                <div class="form-group">
                    <label for="hofName">Head of Family Name *</label>
                    <input type="text" id="hofName" name="head_of_family_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="relation">Relationship with Head of Family *</label>
                    <input type="text" id="relation" name="relation_with_hof" class="form-input" placeholder="e.g., Self, Wife, Son, Daughter, etc." required>
                </div>

                <div id="familyInfo" class="info-box" style="display: none;"></div>

                <div class="form-group">
                    <label for="village">Village/Street *</label>
                    <input type="text" id="village" name="village_or_street" class="form-input" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <button type="button" onclick="window.location.href='/patients.html'" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function registerPatient(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'age') {
                    data[key] = value ? parseInt(value) : null;
                } else {
                    data[key] = value;
                }
            });

            // Set is_head_of_family based on relation
            const relation = data.relation_with_hof ? data.relation_with_hof.toLowerCase() : '';
            data.is_head_of_family = (relation === 'self' || relation === 'स्वयं' || relation === 'मुखिया');

            // If self, set relation_with_hof to 'self'
            if (data.is_head_of_family) {
                data.relation_with_hof = 'self';
                data.head_of_family_id = null;
            }

            try {
                const response = await fetch('/api/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Patient registered successfully!');
                    window.location.href = `/patient-detail.html?id=${result.id}`;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error registering patient:', error);
                alert('Error registering patient');
            }
        }
    </script>
</body>
</html>
