<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Visit - Clinic CRM</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🏥 Clinic CRM</h1>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/patients.html">Patient List</a>
                <a href="/register.html">New Patient</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Record New Visit</h2>
        </div>

        <div class="patient-info-bar" id="patientInfoBar" style="display: none;">
            <div class="patient-brief"></div>
        </div>

        <div class="card">
            <form id="visitForm" onsubmit="saveVisit(event)">
                <input type="hidden" id="patientId" name="patient_id">

                <div class="form-group">
                    <label for="visitDate">Visit Date *</label>
                    <input type="date" id="visitDate" name="visit_date" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="chiefComplaint">Chief Complaint *</label>
                    <textarea id="chiefComplaint" name="chief_complaint" class="form-input"
                              rows="3" placeholder="Enter chief complaint..." required></textarea>
                    <small>Separate multiple complaints with commas (,)</small>
                </div>

                <div class="form-group">
                    <label for="pastHistory">Past History</label>
                    <textarea id="pastHistory" name="past_history" class="form-input"
                              rows="3" placeholder="Previous illnesses..."></textarea>
                    <div id="pastHistorySuggestions" class="suggestions"></div>
                </div>

                <div class="form-group">
                    <label for="prescription">Prescription *</label>
                    <textarea id="prescription" name="prescription" class="form-input"
                              rows="5" placeholder="Medication list...&#10;Example:&#10;Tab Paracetamol 500mg TDS x 3 days&#10;Syrup Cough 2 tsp BD x 5 days" required></textarea>
                </div>

                <div class="form-group">
                    <label for="investigations">Investigations (Optional)</label>
                    <textarea id="investigations" name="investigations" class="form-input"
                              rows="2" placeholder="Any tests or investigations..."></textarea>
                </div>

                <div class="form-group">
                    <label for="feePaid">Fee (₹) *</label>
                    <input type="number" id="feePaid" name="fee_paid" class="form-input"
                           min="0" step="1" value="0" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Visit</button>
                    <button type="button" onclick="goBack()" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentPatient = null;

        async function loadPatientInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            const patientId = urlParams.get('patientId');

            if (!patientId) {
                alert('Patient ID not found');
                window.location.href = '/patients.html';
                return;
            }

            document.getElementById('patientId').value = patientId;

            try {
                const response = await fetch(`/api/patients/${patientId}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                currentPatient = data.patient;
                displayPatientInfo(currentPatient);
                loadPastHistory(data.visits);
            } catch (error) {
                console.error('Error loading patient:', error);
                alert('Error loading patient information');
                window.location.href = '/patients.html';
            }
        }

        function displayPatientInfo(patient) {
            const infoBar = document.getElementById('patientInfoBar');
            infoBar.style.display = 'block';
            infoBar.querySelector('.patient-brief').innerHTML = `
                <strong>${patient.name}</strong> &nbsp;|&nbsp;
                ${patient.age} years, ${patient.gender} &nbsp;|&nbsp;
                📍 ${patient.village_or_street} &nbsp;|&nbsp;
                📱 ${patient.whatsapp_number}
            `;
        }

        function loadPastHistory(visits) {
            if (!visits || visits.length === 0) return;

            // Collect unique past history entries
            const pastHistories = new Set();
            visits.forEach(visit => {
                if (visit.past_history) {
                    pastHistories.add(visit.past_history);
                }
            });

            // Add autocomplete suggestions
            const pastHistoryField = document.getElementById('pastHistory');
            pastHistoryField.addEventListener('focus', function() {
                if (pastHistories.size > 0) {
                    const suggestions = document.getElementById('pastHistorySuggestions');
                    suggestions.innerHTML = `
                        <div class="suggestions-box">
                            <strong>Previously recorded:</strong>
                            ${Array.from(pastHistories).map(history => `
                                <div class="suggestion-item" onclick="document.getElementById('pastHistory').value = '${history.replace(/'/g, "\\'")}'; document.getElementById('pastHistorySuggestions').innerHTML = '';">
                                    ${history}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            });

            pastHistoryField.addEventListener('blur', function() {
                setTimeout(() => {
                    document.getElementById('pastHistorySuggestions').innerHTML = '';
                }, 200);
            });
        }

        async function saveVisit(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'patient_id' || key === 'fee_paid') {
                    data[key] = parseInt(value);
                } else {
                    data[key] = value;
                }
            });

            try {
                const response = await fetch('/api/visits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Visit saved successfully!');
                    window.location.href = `/patient-detail.html?id=${data.patient_id}`;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error saving visit:', error);
                alert('Error saving visit');
            }
        }

        function goBack() {
            const patientId = document.getElementById('patientId').value;
            if (patientId) {
                window.location.href = `/patient-detail.html?id=${patientId}`;
            } else {
                window.location.href = '/patients.html';
            }
        }

        // Set today's date as default
        document.getElementById('visitDate').valueAsDate = new Date();

        // Load patient info on page load
        loadPatientInfo();
    </script>
</body>
</html>
